# This installation reuses the existing dman.pancom.pw Certbot lineage.
# A different hostname requires updating both server_name and certificate paths.
user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Cookies, query strings and exported client credentials never enter logs.
    access_log off;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    ssl_session_tickets off;

    # Resolve again after panel container replacement; do not retain its old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
        return 444;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name dman.pancom.pw;
        ssl_certificate /etc/letsencrypt/live/dman.pancom.pw/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dman.pancom.pw/privkey.pem;

        location / {
            set $panel_upstream panel:8080;
            proxy_pass http://$panel_upstream;
            proxy_http_version 1.1;
            # $host strips :8443 and would break the panel's Origin/CSRF check.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 95s;
            proxy_send_timeout 15s;
            proxy_buffering off;
            proxy_redirect off;
        }
    }
}
