name: tunnelapanel

services:
  panel:
    image: tunnelapanel-panel:${PANEL_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/panel.Dockerfile
    restart: unless-stopped
    # The web-facing panel needs no root access. runtime/panel must be owned by
    # this UID, and the agent shares the GID to grant access to its socket.
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    environment:
      PANEL_LISTEN: ":8080"
      PANEL_STATE_DIR: /data/panel
      PANEL_COOKIE_SECURE: "${PANEL_COOKIE_SECURE:-false}"
      PANEL_ALLOWED_HOSTS: "${PANEL_ALLOWED_HOSTS:-}"
      PANEL_TRUSTED_PROXIES: "${PANEL_TRUSTED_PROXIES:-}"
      TT_SOCKET: /run/tunnelapanel/control.sock
    ports:
      - "127.0.0.1:${PANEL_PORT:-8080}:8080/tcp"
    volumes:
      - ../runtime/panel:/data/panel
      - control:/run/tunnelapanel
    depends_on:
      - endpoint
    # Keep the panel off the endpoint's network: VPN client traffic leaves from
    # the endpoint container and must not reach the panel by service name.
    networks:
      - panel_proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  https:
    profiles: [https]
    # Official stable image, pinned to the verified multi-platform manifest.
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    entrypoint: [nginx, -g, "daemon off;"]
    restart: unless-stopped
    user: "0:0"
    cap_drop: [ALL]
    # Master reads root-only TLS keys; workers drop to nginx and are signalled
    # on graceful reload. CHOWN prepares worker-owned temporary directories.
    cap_add: [SETUID, SETGID, KILL, CHOWN]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    ports:
      - "${PANEL_HTTPS_BIND_IP:-0.0.0.0}:${PANEL_HTTPS_PORT:-8443}:8443/tcp"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Only the panel's certificate lineage, not every key on the host. It is
      # the VPN lineage unless PANEL_CERT_NAME names a separate one.
      - /etc/letsencrypt/live/${PANEL_CERT_NAME:-${TT_CERT_NAME:?set TT_CERT_NAME in deploy/.env}}:/etc/letsencrypt/live/${PANEL_CERT_NAME:-${TT_CERT_NAME}}:ro
      - /etc/letsencrypt/archive/${PANEL_CERT_NAME:-${TT_CERT_NAME}}:/etc/letsencrypt/archive/${PANEL_CERT_NAME:-${TT_CERT_NAME}}:ro
    networks:
      panel_proxy:
        ipv4_address: "${PANEL_PROXY_IP:-172.30.80.3}"
    depends_on:
      - panel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  endpoint:
    image: tunnelapanel-endpoint:${PANEL_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/endpoint.Dockerfile
    restart: unless-stopped
    # Root reads the root-only Let's Encrypt keys. The panel's GID becomes the
    # control socket's group, so the non-root panel can connect to it.
    user: "0:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    environment:
      TT_BINARY: /usr/local/bin/trusttunnel_endpoint
      TT_CONFIG_DIR: /data/config
      TT_STATE_DIR: /data/state
      TT_SOCKET: /run/tunnelapanel/control.sock
      TT_PUBLIC_ADDRESS: "${TT_PUBLIC_ADDRESS:-vpn.example.com:443}"
      TT_METRICS_URL: http://127.0.0.1:1987
    ports:
      # TCP only: QUIC/HTTP3 requires a separate UDP port configuration.
      - "${TT_BIND_IP:-0.0.0.0}:${TT_PORT:-443}:8443/tcp"
    volumes:
      - ../runtime/config:/data/config
      - ../runtime/state:/data/state
      # Mount one lineage at its original paths: live/ links into archive/.
      # Other certificates and keys on the host stay out of this container; the
      # agent refuses to start if hosts.toml references a file outside it.
      - /etc/letsencrypt/live/${TT_CERT_NAME:?set TT_CERT_NAME in deploy/.env}:/etc/letsencrypt/live/${TT_CERT_NAME}:ro
      - /etc/letsencrypt/archive/${TT_CERT_NAME}:/etc/letsencrypt/archive/${TT_CERT_NAME}:ro
      - control:/run/tunnelapanel
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  control:

networks:
  panel_proxy:
    ipam:
      config:
        - subnet: "${PANEL_PROXY_SUBNET:-172.30.80.0/29}"
